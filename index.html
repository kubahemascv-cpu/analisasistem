<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monitoring CS Kubah Emas</title>
<meta name="theme-color" content="#17994F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monitoring CS">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g50:#F2FBF5;--g100:#DDF5E6;--g200:#BDEBD0;--g400:#4CCB86;--g500:#22B35E;--g600:#17994F;--g700:#117A3E;--g800:#0E6132;
  --o50:#FFF4EA;--o100:#FFE3CC;--o500:#F97316;--o600:#EA6A0A;--o700:#B8500A;
  --red:#D92D20;--red-bg:#FEECEA;--sky:#0E7490;--sky-bg:#E0F5FA;
  --bg:#F4FAF6;--card:#fff;--txt:#10261A;--txt2:#3A5144;--mut:#6A7F72;--line:#E1EDE5;--line2:#CFE3D6;
  --sh:0 1px 2px rgba(16,38,26,.05),0 6px 20px rgba(16,38,26,.06);
  --r:16px;
}
html{-webkit-text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}
.deskonly,.btn.deskonly{display:none}
.mut{color:var(--mut)}.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:700}.tr{text-align:right}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.sp{flex:1}.col{display:flex;flex-direction:column;gap:8px}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(900px 500px at 15% -10%,var(--g200),transparent 60%),radial-gradient(700px 480px at 100% 110%,var(--o100),transparent 60%),var(--bg)}
.login .box{width:100%;max-width:380px;background:#fff;border-radius:24px;padding:32px 26px;box-shadow:var(--sh);text-align:center}
.mark{width:60px;height:60px;border-radius:18px;background:linear-gradient(145deg,var(--g400),var(--g600));display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 8px 22px rgba(23,153,79,.35)}
.mark svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.login h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
.login .sub{color:var(--mut);margin:2px 0 22px;font-size:13px}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line2);border-radius:12px;background:#fff;outline:none;transition:.15s}
.inp:focus{border-color:var(--g500);box-shadow:0 0 0 4px rgba(34,179,94,.15)}
textarea.inp{resize:vertical;min-height:70px}
.pin{letter-spacing:.45em;text-align:center;font-size:20px;font-weight:800}
.err{color:var(--red);font-size:12.5px;font-weight:600;margin-top:10px;min-height:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;transition:.15s;white-space:nowrap}
.btn.p{background:var(--g600);color:#fff;box-shadow:0 4px 12px rgba(23,153,79,.28)}
.btn.p:hover{background:var(--g700)}
.btn.o{background:var(--o600);color:#fff;box-shadow:0 4px 12px rgba(234,106,10,.28)}
.btn.g{background:#fff;border:1.5px solid var(--line2);color:var(--txt2)}
.btn.g:hover{border-color:var(--g500);color:var(--g700)}
.btn.w{background:var(--o50);color:var(--o700);border:1.5px solid var(--o100)}
.btn.d{background:var(--red-bg);color:var(--red)}
.btn.s{padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.55;cursor:default}

/* shell */
.app{display:flex;min-height:100vh}
.rail{display:none}
.main{flex:1;min-width:0;padding-bottom:84px}
.top{position:sticky;top:0;z-index:20;background:rgba(244,250,246,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
.top .mark{width:36px;height:36px;border-radius:11px;margin:0;box-shadow:none}
.top .mark svg{width:19px;height:19px}
.top h2{font-size:16px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
.top .who{font-size:11.5px;color:var(--mut)}
.iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--txt2);background:#fff;border:1.5px solid var(--line)}
.iconbtn:hover{border-color:var(--g500);color:var(--g700)}
.page{padding:16px;max-width:1180px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(16,38,26,.06)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10.5px;font-weight:700;color:var(--mut);border-radius:12px}
.tabbar button.on{color:var(--g700);background:var(--g50)}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:31;width:56px;height:56px;border-radius:18px;background:var(--o600);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(234,106,10,.4)}
.fab svg{width:26px;height:26px;stroke-width:2.4}

/* cards & chips */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);padding:16px}
.card h3{font-size:13px;font-weight:800;color:var(--txt2);letter-spacing:.2px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:9px 9px;text-align:left;transition:.15s;box-shadow:var(--sh)}
.stat .n{font-size:22px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
.stat .l{font-size:10.5px;color:var(--mut);font-weight:600;margin-top:2px;line-height:1.25}
.stat.on{border-color:var(--g500);background:var(--g50)}
.stat.warn .n{color:var(--o600)}
.stat.bad .n{color:var(--red)}
.stat.zero .n{color:var(--mut)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters .inp{padding:9px 12px;font-size:13px;width:auto;flex:1;min-width:120px}
.scopes{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;scrollbar-width:none}
.scopes::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:999px;border:1.5px solid var(--line2);background:#fff;font-weight:700;font-size:12.5px;color:var(--txt2);white-space:nowrap;transition:.12s}
.chip:hover{border-color:var(--g500)}
.chip.on{background:var(--g600);border-color:var(--g600);color:#fff}
.chip.o.on{background:var(--o600);border-color:var(--o600)}
.chip.red.on{background:var(--red);border-color:var(--red)}
.chip:disabled{opacity:.45}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--g100);color:var(--g800)}
.pill.o{background:var(--o100);color:var(--o700)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.sky{background:var(--sky-bg);color:var(--sky)}
.pill.gr{background:#EEF2EF;color:var(--txt2)}
.pill.dash{background:#fff;border:1.5px dashed var(--line2);color:var(--mut)}

/* antrean */
.split{display:block}
.qrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.qrow .chip{padding:5px 10px;font-size:11.5px}
.lead{cursor:pointer;display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;box-shadow:var(--sh);transition:.12s;position:relative}
.lead:hover{border-color:var(--g400)}
.lead.sel{border-color:var(--g500);background:var(--g50)}
.lead.late{border-left:5px solid var(--red)}
.lead.chk{border-left:5px solid var(--o500)}
.lead .t1{display:flex;gap:8px;align-items:flex-start}
.lead .nm{font-weight:800;font-size:15px;letter-spacing:-.2px}
.lead .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.lead .nx{margin-top:8px;font-size:12.5px;color:var(--txt2);display:flex;gap:6px;align-items:flex-start}
.lead .nx.late{color:var(--red);font-weight:700}
.empty{text-align:center;padding:42px 16px;color:var(--mut)}
.empty .big{font-size:34px;margin-bottom:6px}
.detailpane{display:none}

/* detail */
.dt h2{font-size:20px;font-weight:800;letter-spacing:-.3px}
.dt .sec{margin-top:18px}
.dt .sec>.lb{font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tl{border-left:2px solid var(--g200);margin-left:6px;padding-left:14px}
.tl .it{position:relative;margin-bottom:12px;font-size:12.5px}
.tl .it::before{content:'';position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--g400);border:2px solid #fff}
.tindak{display:flex;gap:10px;align-items:flex-start;background:var(--g50);border:1.5px solid var(--g100);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.tindak.late{background:var(--red-bg);border-color:#F8C9C4}
.tindak .x{flex:1}
.ok{width:30px;height:30px;border-radius:9px;background:#fff;border:1.5px solid var(--g500);color:var(--g700);display:grid;place-items:center}
.ok:hover{background:var(--g600);color:#fff}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:5px}

/* hasil */
.hero{background:linear-gradient(135deg,var(--g600),var(--g500) 60%,var(--g400));color:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 28px rgba(23,153,79,.3);margin-bottom:14px}
.hero .big{font-size:46px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.hero .of{font-size:16px;font-weight:600;opacity:.9}
.bar{position:relative;height:12px;border-radius:99px;background:rgba(255,255,255,.28);margin:14px 0 6px;overflow:visible}
.bar>i{display:block;height:100%;border-radius:99px;background:#fff}
.bar>b{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--o100);border-radius:3px}
.hero .ln{font-size:12.5px;opacity:.95;display:flex;gap:14px;flex-wrap:wrap}
.warnbox{background:var(--o50);border:1.5px solid var(--o100);color:var(--o700);border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.tile{-webkit-appearance:none;appearance:none;color:var(--txt);font-family:inherit;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--sh);text-align:left;width:100%}
.tile .n{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.tile .l{font-size:12px;font-weight:700;color:var(--txt2);margin-top:3px}
.tile .s{font-size:12px;color:var(--txt2);margin-top:2px}
.tile.warn .n{color:var(--o600)}.tile.bad .n{color:var(--red)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-size:11px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:6px 8px;border-bottom:1.5px solid var(--line)}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th.tr,table.t td.tr{text-align:right}
table.t tr.batal td{color:var(--mut);text-decoration:line-through}
.scroll{overflow-x:auto}
.datebar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.datebar .inp{width:auto;padding:9px 12px;font-weight:700}

/* overlay */
.ov{position:fixed;inset:0;z-index:60;background:rgba(10,32,20,.48);display:flex;align-items:flex-end;justify-content:center;animation:f .15s}
.ov .panel{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:u .2s}
.ov.still,.ov.still .panel{animation:none}
.ov .ph{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.ov .ph h3{font-size:17px;font-weight:800;flex:1;letter-spacing:-.2px}
@keyframes f{from{opacity:0}to{opacity:1}}@keyframes u{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:80;background:var(--txt);color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast.bad{background:var(--red)}
.spin{text-align:center;padding:70px 0;color:var(--mut);font-weight:600}
.spin::before{content:'';display:block;width:30px;height:30px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--g100);border-top-color:var(--g500);animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.hist{font-size:12.5px;border-bottom:1px solid var(--line);padding:9px 0}

@media(min-width:900px){
  .rail{display:flex;flex-direction:column;gap:4px;width:232px;flex:none;background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh}
  .rail .brand{display:flex;gap:10px;align-items:center;margin-bottom:22px;padding:0 6px}
  .rail .brand .mark{width:40px;height:40px;margin:0;border-radius:12px;box-shadow:none}
  .rail .brand .mark svg{width:21px;height:21px}
  .rail .brand b{font-size:15px;font-weight:800;line-height:1.15;display:block}
  .rail .brand span{font-size:11px;color:var(--mut)}
  .rail button.nav{display:flex;gap:11px;align-items:center;padding:11px 12px;border-radius:12px;font-weight:700;color:var(--txt2);text-align:left;width:100%}
  .rail button.nav:hover{background:var(--g50)}
  .rail button.nav.on{background:var(--g100);color:var(--g800)}
  .rail .foot{margin-top:auto;font-size:11.5px;color:var(--mut);padding:0 6px}
  .tabbar,.top .mark,.top .brandt{display:none}
  .main{padding-bottom:30px}
  .page{padding:22px 26px}
  .fab{display:none}
  .deskonly,.btn.deskonly{display:inline-flex}
  .stats{gap:10px;margin-bottom:14px}
  .stat{padding:12px 14px}
  .stat .n{font-size:24px}
  .stat .l{font-size:11.5px}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .split{display:grid;grid-template-columns:minmax(380px,460px) 1fr;gap:18px;align-items:start}
  .detailpane{display:block;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
  .ov{align-items:center}
  .ov .panel{border-radius:22px;max-height:88vh}
}
@media(min-width:1180px){.tiles{grid-template-columns:repeat(4,1fr)}}
@media print{.rail,.tabbar,.top,.fab{display:none!important}}
.sech.sx .xs{color:var(--txt2);font-size:12px}.tiles.sx{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.sech.sx{margin:22px 0 8px;padding-top:4px}.verd{font-size:13px;font-weight:700;line-height:1.4;margin:0 0 8px;padding:9px 12px;border-radius:12px;background:var(--g100);border:1.5px solid var(--g200);color:var(--g800)}.verd-warn{background:var(--o50);border-color:var(--o100);color:#8F3F06}.verd-ok{background:var(--g100);border-color:var(--g200);color:var(--g800)}
.sech{display:flex;align-items:center;gap:8px;margin:18px 0 8px;flex-wrap:wrap}.sech b{font-size:13.5px;font-weight:800;letter-spacing:-.2px}
.qlbl{font-size:11.5px;font-weight:700;color:var(--mut);align-self:center}
.kb{flex:1 1 100%;margin-bottom:2px}.kb .inp{padding:7px 10px;font-size:12.5px}
.lead .need{margin-top:7px;font-size:12.5px;color:var(--txt2)}
.next{display:block;background:linear-gradient(135deg,var(--g600),var(--g500));color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:12px;cursor:pointer;box-shadow:0 8px 22px rgba(23,100,60,.22)}
.next .nm{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:2px 0}
.next .mut{color:rgba(255,255,255,.88)}
.next .need{background:rgba(255,255,255,.16);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13.5px}
.next .btn.g{background:#fff;color:var(--g700);border-color:#fff}
.giliran{background:var(--o50);border:1.5px solid var(--o100);color:var(--o700);border-radius:14px;padding:11px 13px;margin-bottom:12px;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov"></div>
<div id="toast" class="toast hide"></div>

<script>
// ============================================================
// MONITORING CS KUBAH EMAS — Tahap 1
// Antrean Leads · Hasil Harian · Riwayat · Pengaturan
// ============================================================
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz80XbLzHL_tZSI4gUk_h5zt99_CXMn9Ec_MUQt2pUXQgSnA_O2cU7PYjiugyucwV1FDw/exec';
var NEED_SCRIPT = 4;
var APP_VER = 'v3.6';

// Tahap = proses penjualan. Kondisi = posisi di antrean kerja. Prioritas = urgensi. Jangan disamakan.
var TAHAP = ['Gali kebutuhan','Siap ditawarkan','Penawaran terkirim','Proses pesanan','Deal','Ditutup'];
var PRIORITAS = ['P1','P2','P3','Belum diperiksa'];
var KONDISI = ['Perlu diperiksa','Antre CS','Sedang ditangani CS','Menunggu pelanggan','Menunggu internal','Tunda','Selesai'];
var NUNGGU = ['Menunggu pelanggan','Menunggu internal','Tunda'];
var PERAN = ['CS','Penjaga Antrean','Manager'];
var GILIRAN_MENIT = 30;          // aturan uji: chat P2/P3 paling lama diberi giliran tiap 30 menit kerja
var HAMBATAN = ['Antrean','Hitungan','Stok','Pengiriman','Harga','Lainnya'];   // penyebab tertahan. "Menunggu pelanggan" ada di Kondisi
var ALASAN_TUTUP = ['Pelanggan tidak membalas','Harga tidak cocok','Beli di tempat lain','Pembelian ditunda','Hanya tanya-tanya','Belum diketahui'];
var ALASAN_BUKAN = ['Sales / penawaran vendor','Penagihan / urusan hutang','Di luar area','Jasa pemasangan / bukan produk','Salah nomor / spam','Lainnya (bukan calon pembeli)'];
var NILAI_NOTA_MIN = 10000;
// Total nota harian diambil dari sheet REPORT (sumber angka 18,8 dan target 27). Pola sama dengan dashboard lain.
var REPORT_CFG = { id:'1n9Mp66i3JwJE6hdV3jevhOw8EOa1b7Lo8FvBegtsTo4', gid:602747520, sheet:'REPORT V.2', range:'A126:K200' };
var TINDAK_TPL = ['Follow-up penawaran','Kirim hitungan material','Gali kebutuhan lagi','Konfirmasi stok','Konfirmasi jadwal kirim','Tanya keputusan pelanggan'];
var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

var IC = {
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  hist:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>',
  set:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',

function gviz(cfg){
  return new Promise(function(resolve,reject){
    var cb='_rep_'+Date.now()+'_'+Math.floor(Math.random()*9999), sc=document.createElement('script'), done=false;
    function cleanup(){ clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } if(sc.parentNode) sc.parentNode.removeChild(sc); }
    var t=setTimeout(function(){ if(done) return; done=true; cleanup(); reject(new Error('REPORT tidak merespons (timeout)')); },12000);
    window[cb]=function(d){ if(done) return; done=true; cleanup(); if(!d||d.status==='error'||!d.table) reject(new Error('REPORT tidak bisa dibaca (cek izin sheet)')); else resolve(d.table); };
    sc.onerror=function(){ if(done) return; done=true; cleanup(); reject(new Error('REPORT tidak bisa dimuat')); };
    sc.src='https://docs.google.com/spreadsheets/d/'+cfg.id+'/gviz/tq?tqx=reqId:'+Date.now()+';out:json;responseHandler:'+cb+'&gid='+cfg.gid+'&range='+encodeURIComponent(cfg.range)+'&headers=0&cb='+Date.now();
    document.head.appendChild(sc);
  });
}
function numRep(v){ if(typeof v==='number') return v; var x=String(v==null?'':v).replace(/[^0-9,.\-]/g,''); if(!x) return 0; if(/^-?\d{1,3}(\.\d{3})+$/.test(x)) x=x.replace(/\./g,''); else x=x.replace(',','.'); return parseFloat(x)||0; }
// Kolom: A tanggal, E omzet JUMLAH, I nota JUMLAH, J nota ONLINE, K nota OFFLINE. Berhenti di baris TOTAL (di bawahnya ada tabel lain).
function parseReport(table){
  var rows={}, n=0, stop=false, cols=table.cols||[];
  (table.rows||[]).forEach(function(r){
    if(stop) return;
    function raw(i){ var c=r.c?r.c[i]:null; return (!c||c.v===null||c.v===undefined)?'':c.v; }
    function fmt(i){ var c=r.c?r.c[i]:null; return c&&c.f?c.f:''; }
    var a=raw(0);
    if(typeof a==='string'&&/^\s*TOTAL\b/i.test(a)){ if(n) stop=true; return; }
    var dt=null, m, sa=String(a).trim(), sf=String(fmt(0)).trim();
    if((m=sa.match(/^Date\((\d+),(\d+),(\d+)/))) dt=new Date(+m[1],+m[2],+m[3]);
    else if((m=sa.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) dt=new Date(+m[3],+m[2]-1,+m[1]);
    else if(sf&&(m=sf.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) dt=new Date(+m[3],+m[2]-1,+m[1]);
    if(!dt||isNaN(dt)) return;
    var k=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    var nota=numRep(raw(8)), omzet=numRep(raw(4)), on=numRep(raw(9)), off=numRep(raw(10));
    if(!nota&&!omzet&&!on&&!off) return;           // baris belum terisi: BUKAN nol, dianggap tidak ada
    if(rows[k]) return;
    rows[k]={nota:nota,omzet:omzet,online:on,offline:off}; n++;
  });
  return rows;
}

// ---------- model ----------
function getLead(id){ var L=S.d.leads; for(var i=0;i<L.length;i++) if(L[i].id===id) return L[i]; return null; }

function openTindak(l){ return S.d.tindak.filter(function(t){return t.leadId===l.id&&!t.selesai;}).sort(function(a,b){return a.jadwal<b.jadwal?-1:1;}); }

// lama menunggu CS, dihitung dalam MENIT JAM KERJA (malam hari tidak dihitung)
function waitMin(l){ var a=l.tungguSejak||l.masuk; return a?menitKerja(a,nowStr(),S.d.config):0; }
function waitTxt(l){ var m=waitMin(l); return m<1?'baru masuk antrean':durasi(m)+' jam kerja'; }

function csQueue(){
  var arr=[];
  S.d.leads.forEach(function(l){
    if(!isOpen(l)) return;
    var due=NUNGGU.indexOf(l.kondisi)>=0&&isLate(l), antre=l.kondisi==='Antre CS';
    if(!due&&!antre) return;
    var o=openTindak(l)[0], pesan=antre&&l.tahap==='Proses pesanan';
    var why=due?'Janji kabar jatuh tempo':pesan?'Konfirmasi pesanan':l.giliran?'Giliran khusus':(l.prioritas==='Belum diperiksa'?'Belum diperiksa':l.prioritas);
    arr.push({l:l,why:why,key:[(due||pesan)?0:1,(l.giliran&&!due)?0:1,prRank(l.prioritas),due?(o?o.jadwal:'9'):(l.tungguSejak||l.masuk),l.masuk]});
  });
  return arr.sort(cmpKeys);
}
// P2/P3 yang sudah lama antre dan belum diberi giliran (aturan uji 30 menit kerja)
function giliranCandidates(){

  return S.d.leads.filter(function(l){ return isOpen(l)&&l.kondisi==='Antre CS'&&!l.giliran&&(l.prioritas==='P2'||l.prioritas==='P3')&&waitMin(l)>=GILIRAN_MENIT; })
    .sort(function(a,b){ var x=a.tungguSejak||a.masuk, y=b.tungguSejak||b.masuk; return x<y?-1:x>y?1:0; });

function counts(){

function filtered(){

  var list=S.d.leads.filter(function(l){

    if(f.scope==='hari'&&day(l.masuk)!==td) return false;
    if(f.scope==='kemarin'&&day(l.masuk)!==addDays(td,-1)) return false;
    if(f.scope==='7'&&day(l.masuk)<addDays(td,-6)) return false;
    if(f.cs&&l.cs!==f.cs) return false;
    if(f.pr&&l.prioritas!==f.pr) return false;
    if(f.kd&&l.kondisi!==f.kd) return false;
    if(f.th&&l.tahap!==f.th) return false;
    if(f.hb&&l.hambatan!==f.hb) return false;
    if(f.focus==='bd'&&!(isOpen(l)&&l.kondisi==='Perlu diperiksa')) return false;
    if(f.focus==='lj'&&!isLate(l)) return false;
    if(f.focus==='pk'&&!(isOpen(l)&&l.periksa)) return false;
    if(f.focus==='pt'&&!(isOpen(l)&&l.kondisi==='Antre CS')) return false;
    if(q&&l.nama.toLowerCase().indexOf(q)<0&&!(qd&&l.wa.indexOf(qd)>=0)) return false;
    return true;
  });
  var n=nowStr();
  function score(l){
    var o=openTindak(l)[0], late=o&&o.jadwal<n;
    return [isOpen(l)?0:1, late?0:1, l.periksa?0:1, l.kondisi==='Perlu diperiksa'?0:1, prRank(l.prioritas), late?o.jadwal:(o?o.jadwal:'9'), l.masuk];
  }
  list.sort(function(a,b){ var x=score(a),y=score(b); for(var i=0;i<x.length;i++){ if(x[i]<y[i]) return -1; if(x[i]>y[i]) return 1; } return 0; });

}

function hari(D,date,nowS){

  var sahNo={}, sah=N.filter(function(n){ if(n.status!=='Sah'||n.tanggal!==date||sahNo[n.no]) return false; sahNo[n.no]=1; return true; });
  var firstNota={}; N.forEach(function(n){ if(n.status==='Sah'&&n.leadId&&(!firstNota[n.leadId]||n.tanggal<firstNota[n.leadId])) firstNota[n.leadId]=n.tanggal; });
  function kd(l){ return kDay(l.masuk,cfgR); }
  var baru=L.filter(function(l){return kd(l).d===date&&l.jenis==='Baru';});
  var lama=L.filter(function(l){return kd(l).d===date&&l.jenis==='Lama';});
  var spill=L.filter(function(l){return day(l.masuk)===date&&kd(l).d>date;});
  var luarJam=baru.filter(function(l){return kd(l).luar;}), selamaJam=baru.filter(function(l){return !kd(l).luar;});
  function selesaiPada(l){ return (l.ditutup&&day(l.ditutup)<=date)||(firstNota[l.id]&&firstNota[l.id]<=date); }
  function jatuh(t){ return isToday?t.jadwal<=nowS:day(t.jadwal)<=date; }
  function belumSelesai(t){ return !t.selesai||day(t.selesai)>date; }
  // posisi antrean pada akhir hari yang dilihat (hari ini = sekarang; hari lalu = jam tutup)
  var endT=isToday?nowS:(date+' '+(cfgR.jam_sore_selesai||'16:00'));
  var sisa=L.filter(function(l){
    if(l.bukanCalon||kd(l).d>=date) return false;
    return !((l.ditutup&&day(l.ditutup)<date)||(firstNota[l.id]&&firstNota[l.id]<date));
  });
  var menunggu=[], belumPilah=[];
  L.forEach(function(l){
    if(selesaiPada(l)||l.bukanCalon) return;
    var dis=l.diserahkan&&l.diserahkan.slice(0,16)<=endT, amb=l.diambil&&l.diambil.slice(0,16)<=endT;
    if(dis&&!amb) menunggu.push(l);
    else if(!dis&&!amb&&l.masuk.slice(0,16)<=endT) belumPilah.push(l);
  });
  var isMenunggu={}; menunggu.forEach(function(l){ isMenunggu[l.id]=1; });
  var tunda=[],tundaLalu=0;
  L.forEach(function(l){
    if(kd(l).d>date||selesaiPada(l)) return;
    var sebab=false,lalu=false;
    if(isMenunggu[l.id]){ sebab=true; if(day(l.diserahkan)<date) lalu=true; }
    T.forEach(function(t){ if(t.leadId===l.id&&jatuh(t)&&belumSelesai(t)){ sebab=true; if(day(t.jadwal)<date) lalu=true; } });
    if(sebab){ tunda.push(l); if(lalu||kd(l).d<date) tundaLalu++; }
  });
  var calon=baru.filter(function(l){return !l.bukanCalon;}), bukan=baru.length-calon.length;
  var dip=L.filter(function(l){return l.diserahkan&&kDay(l.diserahkan,cfgR).d===date;});
  var dipilah={n:dip.length,p1:dip.filter(function(l){return l.prioritas==='P1';}).length,p2:dip.filter(function(l){return l.prioritas==='P2';}).length,p3:dip.filter(function(l){return l.prioritas==='P3';}).length};
  var tg=[]; L.forEach(function(l){ if(l.diserahkan&&l.diambil&&day(l.diambil)===date) tg.push(menitKerja(l.diserahkan.slice(0,16),l.diambil.slice(0,16),cfgR)); });
  var tawar=L.filter(function(l){return l.penawaran&&day(l.penawaran)===date;});
  var due=T.filter(function(t){return day(t.jadwal)===date;});
  var wa=sah.filter(function(n){return n.kanal==='WA';}), toko=sah.filter(function(n){return n.kanal==='Toko';});
  var batal=N.filter(function(n){return n.status==='Batal'&&n.tanggal===date;});
  var hr=D.harian.filter(function(x){return x.tanggal===date;})[0]||null;
  return {date:date,spill:spill.length,spillBukan:spill.filter(function(l){return l.bukanCalon;}).length,spillHari:spill.length?kd(spill[0]).d:'',sisa:sisa.length,luarJam:luarJam.length,selamaJam:selamaJam.length,baru:baru.length,baruCalon:calon.length,bukanCalon:bukan,lama:lama.length,tunda:tunda.length,tundaLalu:tundaLalu,penawaran:tawar.length,
    dipilah:dipilah,tungguN:tg.length,tungguAvg:tg.length?tg.reduce(function(a,x){return a+x;},0)/tg.length:null,tungguMax:tg.length?Math.max.apply(null,tg):null,
    menungguTutup:menunggu.length,belumDipilah:belumPilah.length,
    fuDue:due.length,fuDone:due.filter(function(t){return t.selesai;}).length,
    nota:sah.length,omzet:sah.reduce(function(a,n){return a+n.nilai;},0),notaWA:wa.length,notaToko:toko.length,
    notaBaru:wa.filter(function(n){return notaKat(n,L,cfgR)==='Lead baru hari itu';}).length,notaLama:wa.filter(function(n){return notaKat(n,L,cfgR)!=='Lead baru hari itu';}).length,
    notaBatal:batal.length,lembur:hr?hr.lembur:null,bantuan:hr?hr.bantuan:null,catatanBantuan:hr?hr.catatanBantuan:'',lengkap:hr?hr.lengkap:false,diisi:!!hr,
    malam:hr?hr.malam:null,pagi:hr?hr.pagi:null,jaga:hr?hr.jaga:null,
    daftarNota:N.filter(function(n){return n.tanggal===date;})};
}
function jamNormal(cfg){
  function m(a,b){ var x=a.split(':'),y=b.split(':'); return (+y[0]*60+ +y[1])-(+x[0]*60+ +x[1]); }
  return m(cfg.jam_pagi_mulai,cfg.jam_pagi_selesai)+m(cfg.jam_sore_mulai,cfg.jam_sore_selesai);
}
// jam tim = jam CS (+lembur) + menit non-CS (malam + pagi + jaga antrean + bantuan pelayanan). Null kalau menit Penjaga belum lengkap.
function timInfo(r,normal){
  var cs=normal+(r.diisi?r.lembur:0);
  if(!r.diisi||r.malam===null||r.pagi===null||r.jaga===null) return {csMin:cs,pjMin:null,timMin:null};
  var pj=r.malam+r.pagi+r.jaga+r.bantuan;
  return {csMin:cs,pjMin:pj,timMin:cs+pj};
}

// ---------- menit kerja (hanya jam & hari kerja, bukan libur) ----------
function cfgSet(str){ var o={}; String(str||'').split(',').forEach(function(x){x=x.trim(); if(x!=='') o[x]=1;}); return o; }
function hhmm(x){ var p=x.split(':'); return (+p[0])*60+(+p[1]); }
// ---- hari kerja: lead yang masuk setelah tutup / sebelum buka / hari libur dikerjakan di hari kerja berikutnya ----
function isWork(d,cfg){ var hk=cfgSet(cfg.hari_kerja||'1,2,3,4,5,6'), lib=cfgSet(cfg.hari_libur); return !!hk[new Date(d+'T00:00:00Z').getUTCDay()]&&!lib[d]; }
function nextWork(d,cfg){ for(var i=0;i<400;i++){ if(isWork(d,cfg)) return d; d=addDays(d,1); } return d; }
// kDay: hari kerja tempat lead ini dikerjakan + apakah masuknya di luar jam kerja
function kDay(dt,cfg){
  var d=day(dt), m=hhmm(String(dt).slice(11,16)), buka=hhmm(cfg.jam_pagi_mulai||'08:00'), tutup=hhmm(cfg.jam_sore_selesai||'16:00');
  if(isWork(d,cfg)){
    if(m<buka) return {d:d,luar:true};
    if(m>=tutup) return {d:nextWork(addDays(d,1),cfg),luar:true};
    return {d:d,luar:false};
  }
  return {d:nextWork(d,cfg),luar:true};
}
// tutup terakhir (<= sekarang): dipakai sebagai isian cepat "masuk di luar jam kerja"
function tutupTerakhir(cfg){
  var n=nowStr(), d=day(n), tt=cfg.jam_sore_selesai||'16:00';
  for(var i=0;i<400;i++){ if(isWork(d,cfg)&&(d+' '+tt)<=n) return d+' '+tt; d=addDays(d,-1); }
  return n;
}
function isLiburView(d,cfg){ return !isWork(d,cfg); }
function notaKat(n,L,cfg){
  if(n.kanal!=='WA') return n.kategori||'';
  var l=null; for(var i=0;i<L.length;i++){ if(L[i].id===n.leadId){ l=L[i]; break; } }
  if(!l) return n.kategori||'';
  return (l.jenis==='Baru'&&kDay(l.masuk,cfg).d===n.tanggal)?'Lead baru hari itu':'Lead sebelumnya / pelanggan lama';
}
// menit kerja antara dua waktu 'yyyy-MM-dd HH:mm': hanya jam kerja, hari kerja, bukan hari libur
function menitKerja(a,b,cfg){
  if(!a||!b||b<=a) return 0;
  var hk=cfgSet(cfg.hari_kerja||'1,2,3,4,5,6'), lib=cfgSet(cfg.hari_libur);
  var seg=[[hhmm(cfg.jam_pagi_mulai),hhmm(cfg.jam_pagi_selesai)],[hhmm(cfg.jam_sore_mulai),hhmm(cfg.jam_sore_selesai)]];
  var da=day(a), db=day(b), tot=0, d=da, n=0;
  function mnt(s){ return hhmm(s.slice(11,16)); }
  while(d<=db&&n++<400){
    var dow=new Date(d+'T00:00:00Z').getUTCDay();
    if(hk[dow]&&!lib[d]){
      var lo=d===da?mnt(a):0, hi=d===db?mnt(b):1440;
      seg.forEach(function(sg){ var x=Math.max(lo,sg[0]), y=Math.min(hi,sg[1]); if(y>x) tot+=y-x; });
    }
    d=addDays(d,1);
  }
  return tot;
}

function riwayatView(){
  if(!S.ri){ loadRiwayat(); return '<div class="spin">Memuat riwayat…</div>'; }
  var f=S.riF, us={}, en={};
  S.ri.forEach(function(r){us[r.oleh]=1; en[r.entitas]=1;});
  var list=S.ri.filter(function(r){return (!f.u||r.oleh===f.u)&&(!f.e||r.entitas===f.e);});
  var names={}; S.d.leads.forEach(function(l){names[l.id]=l.nama;});
  return '<div class="filters"><select class="inp" data-rflt="u">'+selOpts(Object.keys(us),f.u,'Semua pengguna')+'</select><select class="inp" data-rflt="e">'+selOpts(Object.keys(en),f.e,'Semua jenis')+'</select><button class="btn g" data-act="rireload">'+ic('refresh')+'Muat ulang</button></div>'+
    '<div class="card">'+(list.length?list.slice(0,300).map(function(r){return '<div class="hist"><div class="row wrap"><b>'+h(r.aksi)+'</b><span class="pill gr">'+h(r.entitas)+(r.entitas==='Lead'&&names[r.id]?' · '+h(names[r.id]):r.entitas!=='Lead'?' · '+h(r.id):'')+'</span><span class="sp"></span><span class="xs mut">'+h(r.oleh)+' · '+h(r.waktu.slice(0,16))+'</span></div><div class="sm">'+h(r.rincian)+'</div></div>';}).join(''):'<div class="empty">Belum ada riwayat.</div>')+'</div>';
}
function loadRiwayat(){
  api('riwayat_recent',{limit:500}).then(function(j){ if(j.ok){ S.ri=j.riwayat; render(); } else toast(j.error,true); }).catch(function(e){ toast(e.message,true); });
}

function loadScript(src){ return new Promise(function(ok,no){ var s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=function(){no(new Error('gagal memuat pustaka Excel'));}; document.head.appendChild(s); }); }
function buildRingkasan(D,nowS){
  var ds=[]; D.leads.forEach(function(l){ds.push(day(l.masuk));}); D.nota.forEach(function(n){ds.push(n.tanggal);}); D.harian.forEach(function(x){ds.push(x.tanggal);});

  ds=ds.filter(Boolean).sort(); if(!ds.length) return [];
  var out=[], d=ds[0], end=nowS.slice(0,10);
  while(d<=end){
    var r=hari(D,d,nowS), rp0=(S.report&&S.report.ok)?S.report.rows[d]:null;
    var tm=timInfo(r,jamNormal(D.config));
    out.push({'Tanggal':d,'Nota total toko (REPORT)':rp0?rp0.nota:'','Omzet (REPORT)':rp0?rp0.omzet:'','Nota online (REPORT)':rp0?rp0.online:'','Nota offline (REPORT)':rp0?rp0.offline:'',
      'Sisa pekerjaan sebelumnya':r.sisa,'Leads di luar jam kerja':r.luarJam,'Leads selama jam kerja':r.selamaJam,'Leads baru masuk':r.baru,'  calon pembeli':r.baruCalon,'  bukan calon pembeli':r.bukanCalon,'Pelanggan lama kembali':r.lama,
      'Dipilah Penjaga':r.dipilah.n,'  P1':r.dipilah.p1,'  P2':r.dipilah.p2,'  P3':r.dipilah.p3,
      'Lama menunggu CS rata-rata (mnt kerja)':r.tungguN?Math.round(r.tungguAvg):'','Lama menunggu CS terlama (mnt kerja)':r.tungguN?r.tungguMax:'','Lead diambil CS':r.tungguN,

function doExport(){

      'Nota':j.nota.map(function(n){return {'No nota':n.no,Tanggal:n.tanggal,'Lead ID':n.leadId,Nama:n.nama,Kanal:n.kanal,Kategori:notaKat(n,j.leads,cfgE),Nilai:n.nilai,Status:n.status,CS:n.cs,'Dicatat oleh':n.dicatatOleh,Dicatat:n.dicatat,Catatan:n.catatan,'Alasan batal':n.alasanBatal};}),
      'Tindak Lanjut':j.tindak.map(function(t){return {ID:t.id,'Lead ID':t.leadId,Tindakan:t.tindakan,Jadwal:t.jadwal,Selesai:t.selesai,'Dibuat oleh':t.dibuatOleh,'Selesai oleh':t.selesaiOleh};}),
      'Harian':j.harian.map(function(x){return {Tanggal:x.tanggal,'Lembur (menit)':x.lembur,'Bantuan (menit)':x.bantuan,'Catatan bantuan':x.catatanBantuan,'Penjaga malam (menit)':x.malam===null?'':x.malam,'Penjaga pagi (menit)':x.pagi===null?'':x.pagi,'Penjaga jaga (menit)':x.jaga===null?'':x.jaga,'Data lengkap':x.lengkap?'Ya':'Belum',Oleh:x.oleh};}),
      'Riwayat':j.riwayat.map(function(r){return {Waktu:r.waktu,Oleh:r.oleh,Entitas:r.entitas,ID:r.id,Aksi:r.aksi,Rincian:r.rincian};})
    };
    var fname='monitoring-cs-'+todayStr()+'.xlsx';
    return (window.XLSX?Promise.resolve():loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js')).then(function(){
      var wb=XLSX.utils.book_new();
      Object.keys(sheets).forEach(function(n){ var rows=sheets[n]; XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{Info:'Belum ada data'}]),n); });
      XLSX.writeFile(wb,fname);
      toast('File Excel diunduh');
    },function(){
      // cadangan: CSV (bisa dibuka di Excel)
      var csv='﻿', q=function(v){return '"'+String(v===null||v===undefined?'':v).replace(/"/g,'""')+'"';};
      Object.keys(sheets).forEach(function(n){ var rows=sheets[n]; csv+=q('== '+n+' ==')+'\n'; if(rows.length){ var k=Object.keys(rows[0]); csv+=k.map(q).join(',')+'\n'; rows.forEach(function(r){csv+=k.map(function(c){return q(r[c]);}).join(',')+'\n';}); } csv+='\n'; });
      dl('monitoring-cs-'+todayStr()+'.csv',new Blob([csv],{type:'text/csv;charset=utf-8'}));
      toast('Pustaka Excel tidak termuat, diunduh sebagai CSV');
    });
  }).catch(function(e){ toast('Ekspor gagal: '+e.message,true); }).then(function(){ S.busy=false; });
}

  modal('Tambah pengguna','<div class="field"><label>Nama</label><input class="inp" id="ua-nama" maxlength="40"></div><div class="field"><label>Peran</label><select class="inp" id="ua-peran"><option>CS</option><option>Penjaga Antrean</option><option>Manager</option></select><div class="xs mut" style="margin-top:5px">CS = mengerjakan antrean. Penjaga Antrean = memilah P1/P2/P3 dan menyerahkan ke CS. Manager = semua fungsi + pengaturan.</div></div><div class="err" id="ua-err"></div><button class="btn p full" data-act="uasave">Tambah & buat PIN</button>');
};
function showPin(nama,pin){ modal('PIN untuk '+nama,'<div style="text-align:center;margin:10px 0 16px"><div class="pin" style="font-size:34px;letter-spacing:.3em">'+h(pin)+'</div></div><div class="warnbox">Catat dan sampaikan sekarang. PIN ini tidak ditampilkan lagi (tetap bisa dilihat pemilik Google Sheet di tab Users).</div><button class="btn p full" data-act="mclose">Selesai</button>'); }
act.uasave=function(){
  api('user_save',{nama:$('ua-nama').value,peran:$('ua-peran').value}).then(function(j){
    if(!j.ok){ $('ua-err').textContent=j.error; return; }
    load(true).then(function(){ if(j.pin) showPin(j.nama,j.pin); else { mclose(); toast(j.nama+' ditambahkan. Langsung bisa dipilih di layar masuk.'); } });
  });
};
act.upin=function(el){ if(!confirm('Reset PIN '+el.dataset.id+'? PIN lama langsung tidak berlaku.')) return; api('user_save',{nama:el.dataset.id,resetPin:true}).then(function(j){ if(!j.ok) return toast(j.error,true); if(j.pin) showPin(j.nama,j.pin); }); };
act.uaktif=function(el){ var u=S.d.users.filter(function(x){return x.nama===el.dataset.id;})[0]; if(u.aktif&&!confirm('Nonaktifkan '+u.nama+'? Sesinya langsung berakhir.')) return; api('user_save',{nama:u.nama,aktif:!u.aktif}).then(function(j){ if(!j.ok) return toast(j.error,true); load(true); toast('Status pengguna diubah'); }); };

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  if(el.dataset.act==='ovclose'&&e.target.closest('[data-stop]')) return;
  var f=act[el.dataset.act]; if(f){ if(el.tagName==='A') return; f(el,e); }
});
document.addEventListener('keydown',function(e){ if(e.key==='Enter'&&(e.target.id==='nl-wa'||e.target.id==='nl-nama')){ e.preventDefault(); act.lsave($('nl-wa')); } });
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){ S.f.q=t.value; var sel=t.selectionStart; $('leadlist').innerHTML=listHTML(filtered()); return; }
  if(t.classList&&t.classList.contains('kbin')){ S.draft['kb-'+t.dataset.id]=t.value; return; }
  if(t.id==='tk-text'||t.id==='tk-when') saveDraft();
  if(t.id==='nl-wa') waInfo();
  if(t.id==='nl-masuk') masukKat();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.flt){ S.f[t.dataset.flt]=t.value; render(); return; }
  if(t.dataset.rflt){ S.riF[t.dataset.rflt]=t.value; render(); return; }
  if(t.id==='nl-masuk'){ masukKat(); return; }
  if(t.id==='dpick'){ if(t.value&&t.value<=todayStr()){ S.date=t.value; render(); } return; }
  if(t.id==='cat'){ var l=curLead(); if(l&&t.value!==l.catatan) mut('lead_patch',{id:l.id,patch:{catatan:t.value}},'Catatan disimpan'); return; }
  if(t.dataset.act2==='uperan'){ api('user_save',{nama:t.dataset.id,peran:t.value}).then(function(j){ if(!j.ok){ toast(j.error,true); load(true); return; } load(true); toast('Peran diubah'); }); return; }
  if(t.dataset.act2==='cs'){ var l2=curLead(); if(l2&&t.value!==l2.cs) mut('lead_patch',{id:l2.id,patch:{cs:t.value}},'Penanggung jawab diubah'); }
});
window.addEventListener('resize',function(){ if(S.d&&isListTab()) syncDetail(); });
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&S.token&&S.d&&Date.now()-S.loadedAt>90000&&!document.querySelector('#ov [data-act]')&&!$('ov').innerHTML) load(true); });

// ---------- mulai ----------
(function(){
  var t=ls('csm_token');
  if(t){ S.token=t; start(); } else render();
  if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
